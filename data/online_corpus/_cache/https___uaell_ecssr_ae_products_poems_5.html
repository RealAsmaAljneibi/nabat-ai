  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>موسوعة القيادة الإماراتية</title>
  <meta name="description" content="موسوعة القيادة الإماراتية الاتحاد الجامعة لإرث الوطن الفكري النابع من قيادته الرشيدة، مشروع وطني منبثق من مركز الإمارات للدراسات والبحوث الاستراتيجية، يضمُّ بين جنباته موروثًا تاريخيًّا وثقافيًّا وفكريًّا وحضاريًّا، ورصيدًا زاخرًا يجمع مقولات القيادة الإماراتية، وأعمالها الخالدة في مختلف المجالات، المكتوبة منها والمرئية والمنقولة وغيرها، في منصة إلكترونية شاملة جامعة لإرث القيادة الفكري، ووفق أسس علمية رصينة، لتكون مرجعًا أصيلًا للباحثين والدارسين الراغبين في تعزيز دراساتهم بذلك الموروث الثري.">
