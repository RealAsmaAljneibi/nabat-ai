# infra/escriptorium/nginx.conf
# ==============================
# Nginx reverse proxy for eScriptorium.
# Why a separate nginx: gunicorn serves Django but doesn't serve static files
# efficiently. Nginx handles static/media files directly and proxies API/app
# requests to gunicorn.

server {
    listen 80;
    server_name localhost;
    client_max_body_size 200M;   # large manuscript PDF uploads

    # Static files (CSS, JS, icons)
    location /static/ {
        alias /home/escriptorium/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (uploaded manuscript images, trained models)
    location /media/ {
        alias /home/escriptorium/media/;
    }

    # All other requests → Django/gunicorn
    location / {
        proxy_pass         http://app:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;    # long enough for Kraken API calls
    }
}
